spring.application.name=ms-auth
# Render (y otros hosting) indican el puerto con la variable PORT
server.port=${PORT:8090}

# Base de datos:
# - En el PC: H2 guardada en un archivo (carpeta data/), no hay que instalar nada.
# - En la nube: PostgreSQL de Supabase. Render entrega la dirección y la clave con DB_URL, DB_USER y DB_PASSWORD
#   (la clave nunca va en el repositorio). Cada microservicio usa su propio esquema: "auth".
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/acis-auth}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:PUBLIC}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
# El plan gratis de Supabase acepta pocas conexiones a la vez
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: el secreto debe ser el mismo en ms-auth y ms-ordenes.
# Este valor es solo de desarrollo: en producción va en la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:acis-secreto-de-desarrollo-cambiar-en-produccion-2026}
# 8 horas = un turno de trabajo
jwt.duracion-segundos=${JWT_DURACION:28800}

# Correo: "consola" (simulado, lo escribe en la consola) o "gmail" (envío real)
acis.correo.modo=${CORREO_MODO:consola}
acis.correo.remitente=${CORREO_REMITENTE:no-responder@acis.cl}
# Solo para modo gmail (contraseña de aplicación de Google, nunca en el repo):
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USUARIO:}
spring.mail.password=${GMAIL_CLAVE_APP:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Dirección de ms-ordenes (para validar el código del local al registrarse)
acis.ordenes.url=${ORDENES_URL:http://localhost:8091}
