spring.application.name=ms-ordenes
# Render (y otros hosting) indican el puerto con la variable PORT
server.port=${PORT:8091}

# Base de datos H2 guardada en un archivo (carpeta data/)
spring.datasource.url=jdbc:h2:file:./data/acis-ordenes
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mismo secreto que ms-auth (así puede verificar sus tokens).
# Valor solo de desarrollo: en producción va en la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:acis-secreto-de-desarrollo-cambiar-en-produccion-2026}

# Dirección de ms-auth (para consultar los técnicos al asignar una OT)
acis.auth.url=${AUTH_URL:http://localhost:8090}
