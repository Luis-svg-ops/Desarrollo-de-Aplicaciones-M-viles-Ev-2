spring.application.name=ms-ordenes
# Render (y otros hosting) indican el puerto con la variable PORT
server.port=${PORT:8091}

# Base de datos:
# - En el PC: H2 guardada en un archivo (carpeta data/), no hay que instalar nada.
# - En la nube: PostgreSQL de Supabase. Render entrega la dirección y la clave con DB_URL, DB_USER y DB_PASSWORD
#   (la clave nunca va en el repositorio). Cada microservicio usa su propio esquema: "acis_ordenes".
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/acis-ordenes}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:PUBLIC}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
# El plan gratis de Supabase acepta pocas conexiones a la vez
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mismo secreto que ms-auth (así puede verificar sus tokens).
# Valor solo de desarrollo: en producción va en la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:acis-secreto-de-desarrollo-cambiar-en-produccion-2026}

# Dirección de ms-auth (para consultar los técnicos al asignar una OT)
acis.auth.url=${AUTH_URL:http://localhost:8090}
