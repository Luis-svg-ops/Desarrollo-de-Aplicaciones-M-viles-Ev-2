# Publicación del backend en Render (https://render.com), plan gratuito.
# Render lee este archivo ("Blueprint") y crea los 2 microservicios a partir de este repositorio.
# Los dos comparten el secreto del JWT (generado por Render, no está escrito en el repo).
# Base de datos: PostgreSQL en Supabase. La dirección y la clave (DB_URL, DB_USER, DB_PASSWORD) se escriben
# en el panel de Render, en el grupo "acis-secretos": nunca van en el repositorio.
# Cada microservicio es dueño de sus datos: usa su propio esquema (acis_auth / acis_ordenes; "auth" ya lo usa Supabase).

envVarGroups:
  - name: acis-secretos
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  - type: web
    name: acis-ot-auth
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend/ms-auth
    dockerfilePath: ./Dockerfile
    envVars:
      - fromGroup: acis-secretos
      # ms-auth le pregunta a ms-ordenes por el código del local al registrar un cliente
      - key: ORDENES_URL
        value: https://acis-ot-ordenes.onrender.com
      - key: DB_SCHEMA
        value: acis_auth

  - type: web
    name: acis-ot-ordenes
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend/ms-ordenes
    dockerfilePath: ./Dockerfile
    envVars:
      - fromGroup: acis-secretos
      # ms-ordenes le pregunta a ms-auth por los técnicos al asignar una OT
      - key: AUTH_URL
        value: https://acis-ot-auth.onrender.com
      - key: DB_SCHEMA
        value: acis_ordenes
